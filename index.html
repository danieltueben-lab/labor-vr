<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Labor Digitale Technologien – VR-Tour</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #1b1b1e; font-family: -apple-system, system-ui, sans-serif; }
  #hinweis { position: fixed; inset: 0; display: none; place-content: center; z-index: 20;
             color: #eee; padding: 8vw; line-height: 1.6; font-size: 16px; }
  #hinweis code { background: #2c2c31; padding: 2px 6px; border-radius: 3px; }
  #leiste { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
            display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
            padding: 10px 14px; background: rgba(20,20,24,.72); color: #eee; font-size: 14px; }
  #leiste button { font: inherit; color: #eee; background: #3c4d56; border: 0;
                   border-radius: 4px; padding: 6px 12px; cursor: pointer; }
  #leiste button:hover { background: #4e6e7d; }
  #titel { font-weight: 600; margin-right: auto; }
  #modus { position: fixed; top: 0; left: 0; right: 0; z-index: 15; display: none;
           padding: 10px 14px; background: rgba(78,110,125,.94); color: #fff; font-size: 14px; }
  #modus b { font-size: 17px; }
  #werte { position: fixed; inset: 6% 12%; z-index: 25; display: none; overflow: auto;
           background: #16161a; color: #ddd; padding: 20px; border-radius: 8px;
           font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; white-space: pre; }
</style>
</head>
<body>

<div id="hinweis"></div>
<div id="modus"></div>
<div id="werte"></div>

<a-scene renderer="colorManagement: true; antialias: true"
         vr-mode-ui="enterVRButton: #vrknopf"
         loading-screen="dotsColor: #4e6e7d; backgroundColor: #1b1b1e">

  <a-sky id="pano" radius="500" segments-width="128" segments-height="64"></a-sky>
  <a-entity id="marker"></a-entity>

  <a-entity id="rig" position="0 0 0">
    <a-camera id="kamera" position="0 1.6 0" wasd-controls-enabled="false">
      <a-text id="hud" value="" align="center" width="1.0"
              position="0 -0.62 -1.2" color="#F5F4F0" opacity="0.6"></a-text>
    </a-camera>
    <!-- cursor ist noetig, damit der Trigger ein click-Ereignis ausloest.
         laser-controls richtet nur den Strahl ein. -->
    <a-entity id="controller-rechts" laser-controls="hand: right"
              raycaster="objects: .hotspot; far: 30" cursor="fuse: false; rayOrigin: entity"></a-entity>
    <a-entity id="controller-links"  laser-controls="hand: left"
              raycaster="objects: .hotspot; far: 30" cursor="fuse: false; rayOrigin: entity"></a-entity>
  </a-entity>

  <a-entity cursor="rayOrigin: mouse" raycaster="objects: .hotspot; far: 30"></a-entity>
</a-scene>

<div id="leiste">
  <span id="titel">VR-Tour</span>
  <button id="btn-variante">Variante (V)</button>
  <button id="btn-weiter">Nächster Standpunkt (N)</button>
  <button id="btn-nord">Nordwinkel (K)</button>
  <button id="btn-hotspot">Hotspots (H)</button>
  <button id="vrknopf">In VR ansehen</button>
</div>

<script>
// ---------------------------------------------------------------------------
// Standpunkte, Varianten, Hotspots.
//
// Der Variantenwechsel haelt Standpunkt UND Blickrichtung fest und tauscht nur
// die Textur. Nur so ist der Vergleich zweier Tischanordnungen aussagekraeftig.
//
// Hotspots liegen in der echten Bodenebene, also auf minus Augenhoehe. Winkel
// und Abstand sind je Hotspot frei einstellbar, weil der Nachbarstandpunkt oft
// hinter einer Wand liegt und die Markierung vor die Tuer gehoert, nicht in die
// Wand. Voreinstellung ist die Luftlinie zum Nachbarn.
// ---------------------------------------------------------------------------
const sky     = document.querySelector('#pano');
const marker  = document.querySelector('#marker');
const hud     = document.querySelector('#hud');
const titel   = document.querySelector('#titel');
const hinweis = document.querySelector('#hinweis');
const modusBox= document.querySelector('#modus');
const werteBox= document.querySelector('#werte');

let liste = [], nach = new Map();
let iSp = 0, iVar = 0;
let modus = null;          // null | 'nord' | 'hotspot'
let iHotspot = 0;

const S_NORD = 'labor-vr-nordwinkel';
const S_HOT  = 'labor-vr-hotspots';
const gNord = JSON.parse(localStorage.getItem(S_NORD) || '{}');
const gHot  = JSON.parse(localStorage.getItem(S_HOT)  || '{}');

const speichern = () => {
  localStorage.setItem(S_NORD, JSON.stringify(gNord));
  localStorage.setItem(S_HOT,  JSON.stringify(gHot));
};

function zeigeHinweis(html) { hinweis.innerHTML = html; hinweis.style.display = 'grid'; }

async function laden() {
  let tour;
  try {
    const a = await fetch('tour.json', { cache: 'no-store' });
    if (!a.ok) throw new Error(a.status);
    tour = await a.json();
  } catch {
    zeigeHinweis(`<h2>Noch keine Tour vorhanden</h2><p><code>tour.json</code> fehlt.</p>`);
    return;
  }

  for (const [raumId, raum] of Object.entries(tour.raeume ?? {})) {
    for (const [spId, sp] of Object.entries(raum.standpunkte)) {
      const varianten = Object.entries(sp.varianten).map(([id, url]) => ({ id, url }));
      if (!varianten.length) continue;
      const schluessel = `${raumId}__${spId}`;
      const eintrag = {
        schluessel,
        raumName: raum.name,
        standpunktName: sp.name ?? spId,
        raumHatMehrere: raum.mehrereStandpunkte === true,
        x: sp.x, y: sp.y, hoehe: sp.hoehe ?? 1.6,
        nordwinkel: gNord[schluessel] ?? sp.nordwinkel ?? 0,
        nachbarn: sp.nachbarn ?? [],
        hotspots: sp.hotspots ?? {},
        varianten,
      };
      liste.push(eintrag);
      nach.set(schluessel, eintrag);
    }
  }

  if (!liste.length) { zeigeHinweis('<h2>Keine Panoramen gefunden</h2>'); return; }
  setze(0, 0);
}

// Richtung vom Standpunkt a zum Standpunkt b, in Grad, gemessen von der
// +y-Achse des Grundrisses im Uhrzeigersinn.
const planwinkel = (a, b) => Math.atan2(b.x - a.x, b.y - a.y) * 180 / Math.PI;

// Einstellung eines Hotspots holen, notfalls aus der Luftlinie erzeugen.
function hotspotWerte(sp, zielSchluessel) {
  const merker = (gHot[sp.schluessel] ??= {});
  if (!merker[zielSchluessel]) {
    const ausDatei = sp.hotspots?.[zielSchluessel];
    merker[zielSchluessel] = ausDatei
      ? { winkel: ausDatei.winkel, abstand: ausDatei.abstand }
      : { winkel: ((Math.round(planwinkel(sp, nach.get(zielSchluessel))) % 360) + 360) % 360, abstand: 4 };
  }
  return merker[zielSchluessel];
}

function sichtbareNachbarn(sp) {
  return sp.nachbarn.filter((s) => nach.has(s));
}

function baueHotspots(sp) {
  marker.innerHTML = '';
  const ziele = sichtbareNachbarn(sp);
  ziele.forEach((schluessel, i) => {
    const ziel = nach.get(schluessel);
    const w = hotspotWerte(sp, schluessel);
    const gewaehlt = modus === 'hotspot' && i === iHotspot;

    const dreher = document.createElement('a-entity');
    dreher.setAttribute('rotation', `0 ${-(w.winkel + sp.nordwinkel)} 0`);

    const gruppe = document.createElement('a-entity');
    // Genau auf der Bodenebene: minus Augenhoehe, davor der eingestellte Abstand.
    gruppe.setAttribute('position', `0 ${-sp.hoehe} ${-w.abstand}`);

    const scheibe = document.createElement('a-circle');
    scheibe.setAttribute('class', 'hotspot');
    scheibe.setAttribute('radius', '0.55');
    scheibe.setAttribute('rotation', '-90 0 0');
    scheibe.setAttribute('material',
      `color: ${gewaehlt ? '#D8A34E' : '#4E6E7D'}; opacity: ${gewaehlt ? 0.85 : 0.55}; ` +
      'transparent: true; side: double; shader: flat');
    scheibe.dataset.ziel = schluessel;

    const beschriftung = document.createElement('a-text');
    beschriftung.setAttribute('value', ziel.raumHatMehrere ? ziel.standpunktName : ziel.raumName);
    beschriftung.setAttribute('align', 'center');
    beschriftung.setAttribute('width', '3.4');
    beschriftung.setAttribute('color', '#F5F4F0');
    beschriftung.setAttribute('rotation', '-90 0 0');
    beschriftung.setAttribute('position', '0 0.02 1.0');

    gruppe.appendChild(scheibe);
    gruppe.appendChild(beschriftung);
    dreher.appendChild(gruppe);
    marker.appendChild(dreher);
  });
}

function setze(spIndex, varIndex) {
  iSp = (spIndex + liste.length) % liste.length;
  const sp = liste[iSp];
  iVar = (varIndex + sp.varianten.length) % sp.varianten.length;
  const v = sp.varianten[iVar];

  sky.setAttribute('material', 'src', v.url);
  sky.setAttribute('rotation', `0 ${sp.nordwinkel} 0`);

  const teile = [sp.raumName];
  if (sp.raumHatMehrere) teile.push(sp.standpunktName);
  if (sp.varianten.length > 1) teile.push(`${v.id} (${iVar + 1}/${sp.varianten.length})`);
  const text = teile.join(' · ');
  titel.textContent = text;
  hud.setAttribute('value', text);

  iHotspot = 0;
  baueHotspots(sp);
  zeichneModus();

  for (const andere of sp.varianten) new Image().src = andere.url;
}

function springe(schluessel) {
  if (modus === 'hotspot') return;          // im Bearbeitungsmodus nicht wegspringen
  const i = liste.findIndex((s) => s.schluessel === schluessel);
  if (i >= 0) setze(i, 0);
}

// --- Bearbeitungsmodi ------------------------------------------------------
function zeichneModus() {
  const sp = liste[iSp];
  if (!modus) { modusBox.style.display = 'none'; return; }
  modusBox.style.display = 'block';
  const wo = `${sp.raumName}${sp.raumHatMehrere ? ' · ' + sp.standpunktName : ''}`;
  if (modus === 'nord') {
    modusBox.innerHTML = `Nordwinkel · ${wo} · <b>${sp.nordwinkel}°</b> &nbsp;
      Pfeil links/rechts = 1°, mit Umschalt = 10° · W zeigt alle Werte · K beendet`;
  } else {
    const ziele = sichtbareNachbarn(sp);
    if (!ziele.length) { modusBox.innerHTML = `Hotspots · ${wo} · keine Nachbarn mit Panorama · H beendet`; return; }
    const s = ziele[iHotspot];
    const w = hotspotWerte(sp, s);
    modusBox.innerHTML = `Hotspot ${iHotspot + 1}/${ziele.length} · ${wo} &rarr;
      <b>${nach.get(s).raumName}${nach.get(s).raumHatMehrere ? ' ' + nach.get(s).standpunktName : ''}</b> ·
      Winkel <b>${w.winkel}°</b> · Abstand <b>${w.abstand.toFixed(2)} m</b> &nbsp;
      Pfeile drehen und schieben, Umschalt = grob · Tab waehlt · W zeigt Werte · H beendet`;
  }
}

function verstelleNord(d) {
  const sp = liste[iSp];
  sp.nordwinkel = ((sp.nordwinkel + d) % 360 + 360) % 360;
  gNord[sp.schluessel] = sp.nordwinkel;
  speichern();
  sky.setAttribute('rotation', `0 ${sp.nordwinkel} 0`);
  baueHotspots(sp);
  zeichneModus();
}

function verstelleHotspot(dWinkel, dAbstand) {
  const sp = liste[iSp];
  const ziele = sichtbareNachbarn(sp);
  if (!ziele.length) return;
  const w = hotspotWerte(sp, ziele[iHotspot]);
  if (dWinkel) w.winkel = Math.round(((w.winkel + dWinkel) % 360 + 360) % 360);
  if (dAbstand) w.abstand = Math.min(20, Math.max(1, +(w.abstand + dAbstand).toFixed(2)));
  speichern();
  baueHotspots(sp);
  zeichneModus();
}

function zeigeWerte() {
  const offen = werteBox.style.display === 'block';
  werteBox.style.display = offen ? 'none' : 'block';
  if (offen) return;
  const zeilen = liste.map((sp) => {
    const hs = sichtbareNachbarn(sp)
      .map((s) => `      "${s}": { "winkel": ${hotspotWerte(sp, s).winkel}, "abstand": ${hotspotWerte(sp, s).abstand} }`)
      .join(',\n');
    return `  ${sp.schluessel}:\n    "nordwinkel": ${sp.nordwinkel},\n    "hotspots": {\n${hs}\n    }`;
  });
  werteBox.textContent =
    'Werte fuer konfiguration/standpunkte.json:\n\n' + zeilen.join('\n\n') + '\n\n(W schliesst dieses Fenster)';
}

// --- Bedienung -------------------------------------------------------------
const naechsteVariante    = () => setze(iSp, iVar + 1);
const naechsterStandpunkt = () => setze(iSp + 1, 0);
const vorherigerStandpunkt= () => setze(iSp - 1, 0);
const schalte = (m) => { modus = modus === m ? null : m; iHotspot = 0; baueHotspots(liste[iSp]); zeichneModus(); };

document.querySelector('#btn-variante').onclick = naechsteVariante;
document.querySelector('#btn-weiter').onclick   = naechsterStandpunkt;
document.querySelector('#btn-nord').onclick     = () => schalte('nord');
document.querySelector('#btn-hotspot').onclick  = () => schalte('hotspot');

addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  const grob = e.shiftKey;
  if (k === 'v') return naechsteVariante();
  if (k === 'n') return naechsterStandpunkt();
  if (k === 'p') return vorherigerStandpunkt();
  if (k === 'k') return schalte('nord');
  if (k === 'h') return schalte('hotspot');
  if (k === 'w' && modus) return zeigeWerte();
  if (!modus) return;

  if (e.key === 'Tab' && modus === 'hotspot') {
    const n = sichtbareNachbarn(liste[iSp]).length;
    if (n) { iHotspot = (iHotspot + 1) % n; baueHotspots(liste[iSp]); zeichneModus(); }
    e.preventDefault(); return;
  }
  const schritt = { ArrowLeft: -1, ArrowRight: 1 }[e.key];
  if (schritt !== undefined) {
    if (modus === 'nord') verstelleNord(schritt * (grob ? 10 : 1));
    else verstelleHotspot(schritt * (grob ? 10 : 1), 0);
    e.preventDefault(); return;
  }
  if (modus === 'hotspot' && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    verstelleHotspot(0, (e.key === 'ArrowUp' ? 1 : -1) * (grob ? 1 : 0.25));
    e.preventDefault();
  }
});

document.querySelector('a-scene').addEventListener('click', (e) => {
  const ziel = e.target?.dataset?.ziel;
  if (ziel) springe(ziel);
});

// In VR ist die HTML-Leiste unsichtbar, alles laeuft ueber den Controller:
// Trigger auf einen Hotspot springt, A wechselt die Variante,
// B geht zum naechsten Standpunkt. Ein Controller genuegt.
for (const id of ['#controller-rechts', '#controller-links']) {
  const c = document.querySelector(id);
  c.addEventListener('abuttondown', naechsteVariante);
  c.addEventListener('xbuttondown', naechsteVariante);
  c.addEventListener('bbuttondown', naechsterStandpunkt);
  c.addEventListener('ybuttondown', naechsterStandpunkt);
}

laden();
</script>
</body>
</html>
