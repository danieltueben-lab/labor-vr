name: Deploy Pages

# Liegt im veroeffentlichten Zweig, weil dorthin per "git subtree push --prefix=docs"
# ausschliesslich der Inhalt von docs/ gelangt.

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Bewusst false: bei true bricht ein neuer Lauf die laufende Pages-Auslieferung
  # des vorherigen ab, was hier zu "Deployment cancelled" gefuehrt hat.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Vorgabe sind 10 Minuten. GitHubs Auslieferung hat am 2026-08-06
          # laenger gebraucht und lief in diesen Timeout, obwohl nichts kaputt war.
          timeout: 1800000
